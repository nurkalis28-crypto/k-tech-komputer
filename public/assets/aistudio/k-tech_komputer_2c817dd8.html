<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>K-Tech Komputer — Layanan Servis</title>
<style>
:root{--navy:#10243b;--blue:#1769aa;--cyan:#23b8c7;--ink:#1b2b3b;--muted:#6b7b8d;--bg:#f3f7fb;--line:#e1e9f0;--white:#fff;--green:#16865d;--red:#c44747;--amber:#b7791f;--shadow:0 12px 32px #15324b12}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}.hidden{display:none!important}.app{min-height:100vh}.topbar{background:var(--navy);color:white;padding:13px max(18px,calc((100% - 1180px)/2));display:flex;align-items:center;justify-content:space-between;gap:14px;position:sticky;top:0;z-index:5;box-shadow:0 4px 18px #10243b24}.brand{display:flex;align-items:center;gap:11px;font-weight:800;letter-spacing:.2px}.logo{width:38px;height:38px;border-radius:12px;background:linear-gradient(135deg,var(--cyan),#6487ff);display:grid;place-items:center;font-size:21px}.top-actions{display:flex;align-items:center;gap:10px}.wrap{max-width:1180px;margin:26px auto;padding:0 18px}.notice{background:#fff7df;border:1px solid #f1d995;color:#785514;border-radius:12px;padding:11px 14px;font-size:13px;margin-bottom:18px}.hero{background:linear-gradient(120deg,#10243b,#145d89);color:white;border-radius:20px;padding:26px;display:flex;justify-content:space-between;align-items:center;gap:20px;box-shadow:var(--shadow)}.hero h1{font-size:clamp(24px,4vw,34px);line-height:1.15;margin:0 0 8px}.hero p{margin:0;color:#d9e8f3;max-width:620px}.hero-icon{font-size:64px;opacity:.9}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin:18px 0}.stat,.card{background:white;border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:var(--shadow)}.stat small{color:var(--muted)}.stat strong{display:block;font-size:26px;margin-top:4px}.section-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:25px 0 12px}.section-head h2{font-size:19px;margin:0}.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.service-card h3{margin:0 0 6px}.service-card p{color:var(--muted);font-size:13px;min-height:40px}.price{font-weight:800;color:var(--blue);font-size:18px}.btn{border:0;border-radius:10px;background:var(--blue);color:white;padding:10px 15px;font-weight:700;transition:.15s}.btn:hover{filter:brightness(1.08);transform:translateY(-1px)}.btn.secondary{background:#eaf2f8;color:var(--navy)}.btn.ghost{background:transparent;color:inherit;border:1px solid #ffffff55}.btn.danger{background:var(--red)}.btn.success{background:var(--green)}.btn.small{padding:7px 10px;font-size:13px}.btn:disabled{opacity:.5;cursor:not-allowed;transform:none}.tabs{display:flex;gap:7px;flex-wrap:wrap;margin:20px 0}.tab{border:1px solid var(--line);background:white;border-radius:10px;padding:9px 13px;color:var(--muted);font-weight:700}.tab.active{background:var(--navy);color:white;border-color:var(--navy)}.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.between{display:flex;justify-content:space-between;align-items:center;gap:12px}.muted{color:var(--muted)}.smalltext{font-size:12px;color:var(--muted)}.table-wrap{overflow:auto}table{border-collapse:collapse;width:100%;min-width:650px}th,td{text-align:left;padding:12px 10px;border-bottom:1px solid var(--line);font-size:13px}th{color:var(--muted);font-weight:700;background:#f8fafc}.badge{display:inline-block;border-radius:999px;padding:4px 9px;font-size:11px;font-weight:800;background:#eaf2f8;color:#24516f}.badge.green{background:#e4f6ed;color:#16734e}.badge.amber{background:#fff2d8;color:#916114}.badge.red{background:#fde9e9;color:#a53636}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:13px}.field{display:flex;flex-direction:column;gap:5px}.field.full{grid-column:1/-1}.field label{font-size:13px;font-weight:700}.field input,.field select,.field textarea{width:100%;padding:10px 11px;border:1px solid #ccd8e2;border-radius:9px;background:white;color:var(--ink);outline:none}.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--blue);box-shadow:0 0 0 3px #1769aa18}.field textarea{min-height:90px;resize:vertical}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.empty{text-align:center;padding:28px;color:var(--muted)}.device-row,.order-row{padding:13px 0;border-bottom:1px solid var(--line)}.order-row:last-child{border:0}.order-title{font-weight:800}.code{font-family:ui-monospace,monospace;color:var(--blue);font-weight:800}.modal-back{position:fixed;inset:0;background:#0b1d2eb0;z-index:20;display:grid;place-items:center;padding:16px}.modal{background:white;border-radius:18px;width:min(720px,100%);max-height:90vh;overflow:auto;padding:22px;box-shadow:0 24px 80px #0004}.modal h2{margin:0 0 15px}.close{border:0;background:#edf2f6;border-radius:9px;padding:7px 11px}.timeline{border-left:2px solid #dce8f1;margin:12px 0 5px 8px;padding-left:19px}.event{position:relative;padding:0 0 17px}.event:before{content:"";position:absolute;left:-26px;top:5px;width:11px;height:11px;border-radius:50%;background:var(--cyan);border:3px solid white;box-shadow:0 0 0 1px #9bb6c9}.event strong{display:block}.event small{color:var(--muted)}.photo{max-width:100%;max-height:210px;border-radius:12px;object-fit:contain;background:#f3f7fb;border:1px solid var(--line)}.auth{max-width:460px;margin:7vh auto;padding:0 16px}.auth .card{padding:25px}.auth h1{margin:0}.toast{position:fixed;right:18px;bottom:18px;background:#10243b;color:white;padding:12px 17px;border-radius:11px;box-shadow:var(--shadow);z-index:50;max-width:min(420px,90vw)}.footer{text-align:center;color:var(--muted);font-size:12px;padding:30px}.pill{padding:5px 9px;border-radius:99px;background:#e8f7f8;color:#167b86;font-size:12px;font-weight:700}
@media(max-width:850px){.grid{grid-template-columns:repeat(2,1fr)}.cards{grid-template-columns:repeat(2,1fr)}}@media(max-width:580px){.wrap{margin:16px auto}.hero{padding:20px}.hero-icon{font-size:42px}.grid,.cards{grid-template-columns:1fr 1fr;gap:9px}.stat,.card{padding:14px}.form-grid{grid-template-columns:1fr}.field.full{grid-column:auto}.topbar{padding:10px 14px}.brand span:last-child{font-size:14px}.top-actions .userlabel{display:none}.section-head{align-items:flex-start}.modal{padding:17px}.grid .stat strong{font-size:22px}}@media(max-width:380px){.grid,.cards{grid-template-columns:1fr}}
</style>
</head>
<body>
<div id="app" class="app"></div>
<div id="modalRoot"></div><div id="toastRoot"></div>
<script>
(()=>{
'use strict';
const KEY='ktech_komputer_v1';
const $=s=>document.querySelector(s);
const money=n=>new Intl.NumberFormat('id-ID',{style:'currency',currency:'IDR',maximumFractionDigits:0}).format(Number(n)||0);
const date=v=>v?new Date(v).toLocaleString('id-ID',{dateStyle:'medium',timeStyle:'short'}):'—';
const uid=prefix=>prefix+'_'+Date.now().toString(36)+'_'+Math.random().toString(36).slice(2,7);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const statuses=['Menunggu Pemeriksaan','Sedang Diperiksa','Menunggu Persetujuan Biaya','Menunggu Konfirmasi Pelanggan','Menunggu Antrean Perbaikan','Sedang Diperbaiki','Menunggu Pengambilan','Selesai','Dibatalkan'];
const seed=()=>({users:[{id:'u_admin',nama:'Admin K-Tech',email:'admin@ktech.local',noHp:'',alamat:'',role:'admin',password:'admin123'}],devices:[],services:[
{id:'s1',namaLayanan:'Pemeriksaan & Diagnosa',deskripsi:'Pemeriksaan awal kondisi laptop atau komputer.',harga:50000,status:'aktif'},
{id:'s2',namaLayanan:'Instalasi Ulang Sistem Operasi',deskripsi:'Instalasi ulang dan konfigurasi dasar sistem operasi.',harga:150000,status:'aktif'},
{id:'s3',namaLayanan:'Perbaikan Hardware',deskripsi:'Pemeriksaan dan perbaikan komponen perangkat keras.',harga:200000,status:'aktif'},
{id:'s4',namaLayanan:'Upgrade RAM / SSD',deskripsi:'Pemasangan dan pengecekan upgrade memori atau penyimpanan.',harga:100000,status:'aktif'},
{id:'s5',namaLayanan:'Pembersihan & Maintenance',deskripsi:'Pembersihan debu dan perawatan berkala perangkat.',harga:100000,status:'aktif'},
{id:'s6',namaLayanan:'Perbaikan Software',deskripsi:'Penanganan error aplikasi, driver, dan sistem.',harga:75000,status:'aktif'}],orders:[],tracking:[],payments:[],session:null});
let db=load();
function load(){try{const x=JSON.parse(localStorage.getItem(KEY));if(x&&x.users&&x.orders)return x}catch(e){}return seed()}
function save(){try{localStorage.setItem(KEY,JSON.stringify(db));return true}catch(e){toast('Penyimpanan gagal. Hapus foto besar atau reset data demo.');return false}}
function toast(msg){const root=$('#toastRoot');root.innerHTML=`<div class="toast">${esc(msg)}</div>`;setTimeout(()=>root.innerHTML='',3200)}
const me=()=>db.users.find(u=>u.id===db.session);
const isAdmin=()=>me()?.role==='admin';
const orderBy=id=>db.orders.find(o=>o.id===id);
const userBy=id=>db.users.find(u=>u.id===id);
const deviceBy=id=>db.devices.find(d=>d.id===id);
const serviceBy=id=>db.services.find(s=>s.id===id);
const statusClass=s=>s==='Selesai'||s==='Lunas'?'green':(['Dibatalkan','Ditolak'].includes(s)?'red':(['Menunggu Persetujuan Biaya','Menunggu Konfirmasi Pelanggan','Menunggu Verifikasi'].includes(s)?'amber':''));
function badge(s){return `<span class="badge ${statusClass(s)}">${esc(s)}</span>`}
function addTrack(o,status,note='Status diperbarui'){db.tracking.push({id:uid('trk'),pesananId:o.id,adminId:me()?.id||'system',status,catatan:note,tanggalUpdate:new Date().toISOString()})}
function makeCode(){let code;do{code='KT-'+new Date().toISOString().slice(2,10).replaceAll('-','')+'-'+Math.random().toString(36).slice(2,7).toUpperCase()}while(db.orders.some(o=>o.kodeServis===code));return code}
function go(tab){state.tab=tab;render()}
let state={tab:'dashboard',filter:'Semua'};
function render(){if(!me()){renderAuth();return}renderApp()}
function renderAuth(){ $('#app').innerHTML=`<header class="topbar"><div class="brand"><div class="logo">🛠</div><span>K-TECH KOMPUTER</span></div><span class="pill">Layanan servis terpercaya</span></header><main class="auth"><div class="card"><div class="pill">CUSTOMER & ADMIN PORTAL</div><h1 style="margin-top:12px">Selamat datang 👋</h1><p class="muted">Pesan servis, setujui estimasi, dan pantau perbaikan perangkat Anda.</p><div class="tabs"><button class="tab active" id="loginTab" onclick="showAuth('login')">Masuk</button><button class="tab" id="regTab" onclick="showAuth('register')">Daftar pelanggan</button></div><div id="authForm"></div><hr style="border:0;border-top:1px solid var(--line);margin:20px 0"><div class="smalltext"><b>Akun admin demo</b><br>Email: admin@ktech.local<br>Password: admin123<br><br>Gunakan data contoh. Ini prototype lokal, bukan autentikasi produksi.</div></div></main>`;showAuth('login')}
window.showAuth=mode=>{const login=mode==='login';$('#loginTab').classList.toggle('active',login);$('#regTab').classList.toggle('active',!login);$('#authForm').innerHTML=login?`<form id="loginForm"><div class="field"><label>Email</label><input name="email" type="email" required placeholder="nama@email.com"></div><div class="field" style="margin-top:12px"><label>Password</label><input name="password" type="password" required></div><button class="btn" style="width:100%;margin-top:17px">Masuk ke aplikasi</button></form>`:`<form id="registerForm" class="form-grid"><div class="field full"><label>Nama lengkap</label><input name="nama" required maxlength="80"></div><div class="field full"><label>Email</label><input name="email" type="email" required></div><div class="field"><label>No. HP (opsional)</label><input name="noHp" inputmode="tel"></div><div class="field"><label>Password</label><input name="password" type="password" minlength="6" required></div><div class="field full"><label>Alamat (opsional)</label><textarea name="alamat"></textarea></div><div class="field full"><button class="btn">Buat akun pelanggan</button></div></form>`;
$('#loginForm')?.addEventListener('submit',e=>{e.preventDefault();const f=new FormData(e.target),u=db.users.find(x=>x.email.toLowerCase()===String(f.get('email')).trim().toLowerCase()&&x.password===f.get('password'));if(!u)return toast('Email atau password salah.');db.session=u.id;save();state.tab='dashboard';render();toast('Berhasil masuk.')});
$('#registerForm')?.addEventListener('submit',e=>{e.preventDefault();const f=new FormData(e.target),email=String(f.get('email')).trim().toLowerCase();if(db.users.some(u=>u.email.toLowerCase()===email))return toast('Email sudah terdaftar.');const u={id:uid('usr'),nama:String(f.get('nama')).trim(),email,noHp:String(f.get('noHp')).trim(),alamat:String(f.get('alamat')).trim(),role:'customer',password:String(f.get('password'))};db.users.push(u);db.session=u.id;save();render();toast('Registrasi berhasil.')})}
function renderApp(){const admin=isAdmin();const tabs=admin?[['dashboard','Dashboard'],['orders','Pesanan'],['services','Layanan']]:[['dashboard','Dashboard'],['booking','Pesan Servis'],['devices','Perangkat'],['orders','Pesanan Saya'],['history','Riwayat']];
$('#app').innerHTML=`<header class="topbar"><div class="brand"><div class="logo">🛠</div><span>K-TECH KOMPUTER</span></div><div class="top-actions"><span class="userlabel">${esc(me().nama)} · ${admin?'Admin':'Pelanggan'}</span><button class="btn ghost small" onclick="logout()">Keluar</button></div></header><main class="wrap"><div class="notice">⚠ <b>Mode prototype lokal.</b> Data tersimpan hanya di browser ini. Jangan masukkan password asli, data sensitif, atau bukti pembayaran sungguhan.</div><section class="hero"><div><div class="pill">K-TECH SERVICE CENTER</div><h1>${admin?'Panel Operasional':'Perangkat bermasalah? Kami bantu.'}</h1><p>${admin?'Kelola pemeriksaan, estimasi, progres perbaikan, dan pembayaran pelanggan.':'Pesan layanan dengan mudah, dapatkan estimasi biaya, dan pantau proses perbaikan dari satu tempat.'}</p><div class="actions">${admin?'<button class="btn" onclick="go(\'orders\')">Kelola pesanan</button>':'<button class="btn" onclick="go(\'booking\')">＋ Pesan servis</button>'}</div></div><div class="hero-icon">💻</div></section><nav class="tabs">${tabs.map(([id,label])=>`<button class="tab ${state.tab===id?'active':''}" onclick="go('${id}')">${label}</button>`).join('')}</nav><div id="content">${content()}</div></main><footer class="footer">© ${new Date().getFullYear()} K-Tech Komputer · Prototype MVP · <button class="btn secondary small" onclick="resetDemo()">Reset data demo</button></footer>`}
function content(){const admin=isAdmin(),mine=db.orders.filter(o=>admin||o.userId===me().id),active=mine.filter(o=>!['Selesai','Dibatalkan'].includes(o.status));if(state.tab==='dashboard')return dashboard(mine,active,admin);if(state.tab==='booking'&&!admin)return booking();if(state.tab==='devices'&&!admin)return devices();if(state.tab==='orders'||state.tab==='history')return orderList(mine,state.tab==='history');if(state.tab==='services'&&admin)return services();return dashboard(mine,active,admin)}
function dashboard(mine,active,admin){const counts=admin?statuses.slice(0,8).map(s=>[s,mine.filter(o=>o.status===s).length]):[['Pesanan aktif',active.length],['Menunggu persetujuan',mine.filter(o=>o.persetujuanBiaya==='menunggu'&&o.estimasiBiaya!==null).length],['Selesai',mine.filter(o=>o.status==='Selesai').length],['Total pesanan',mine.length]];return `<div class="grid">${counts.map(([l,n])=>`<div class="stat"><small>${esc(l)}</small><strong>${n}</strong></div>`).join('')}</div><div class="section-head"><h2>${admin?'Pesanan terbaru':'Aktivitas servis Anda'}</h2><button class="btn secondary small" onclick="go('orders')">Lihat semua</button></div><div class="card">${mine.length?mine.slice().sort((a,b)=>b.tanggalMasuk.localeCompare(a.tanggalMasuk)).slice(0,5).map(o=>orderRow(o,admin)).join(''):'<div class="empty">Belum ada pesanan. '+(admin?'Pesanan pelanggan akan muncul di sini.':'Mulai dengan membuat pemesanan servis.')+'</div>'}</div>${!admin?`<div class="section-head"><h2>Layanan populer</h2><span class="muted smalltext">Harga indikatif</span></div><div class="cards">${db.services.filter(s=>s.status==='aktif').slice(0,3).map(serviceCard).join('')}</div>`:''}`}
function serviceCard(s){return `<article class="card service-card"><div class="pill">LAYANAN</div><h3 style="margin-top:10px">${esc(s.namaLayanan)}</h3><p>${esc(s.deskripsi)}</p><div class="between"><span class="price">${money(s.harga)}</span><span class="smalltext">Mulai dari</span></div></article>`}
function booking(){const devices=db.devices.filter(d=>d.userId===me().id),services=db.services.filter(s=>s.status==='aktif');return `<div class="section-head"><h2>Buat pemesanan servis</h2><span class="muted smalltext">Estimasi katalog belum final</span></div><div class="card"><form id="bookingForm" class="form-grid"><div class="field"><label>Perangkat</label><select name="perangkatId" required>${devices.map(d=>`<option value="${d.id}">${esc(d.jenisPerangkat)} · ${esc(d.merek)} ${esc(d.model)}</option>`).join('')}</select></div><div class="field"><label>Layanan yang dibutuhkan</label><select name="layananId" required>${services.map(s=>`<option value="${s.id}">${esc(s.namaLayanan)} — ${money(s.harga)}</option>`).join('')}</select></div><div class="field full"><label>Keluhan / gejala kerusakan</label><textarea name="keluhan" required minlength="8" maxlength="1000" placeholder="Contoh: laptop menyala tetapi layar tetap hitam..."></textarea></div><div class="field full"><label>Foto perangkat (JPG/PNG, maksimal 2 MB)</label><input name="foto" type="file" accept="image/png,image/jpeg"><img id="photoPreview" class="photo hidden" alt="Pratinjau foto"></div><div class="field full"><div class="notice" style="margin:0">Pemesanan akan masuk tahap pemeriksaan. Biaya final ditentukan admin setelah perangkat diperiksa dan harus disetujui sebelum perbaikan dimulai.</div></div><div class="field full"><button class="btn" ${!devices.length||!services.length?'disabled':''}>Kirim pemesanan</button></div></form>${!devices.length?'<p class="muted">Tambahkan perangkat terlebih dahulu pada menu Perangkat.</p>':''}</div>`}
function devices(){const ds=db.devices.filter(d=>d.userId===me().id);return `<div class="section-head"><h2>Perangkat saya</h2></div><div class="card"><form id="deviceForm" class="form-grid"><div class="field"><label>Jenis perangkat</label><select name="jenisPerangkat"><option>Laptop</option><option>Komputer</option></select></div><div class="field"><label>Merek</label><input name="merek" required placeholder="Contoh: Lenovo"></div><div class="field"><label>Model</label><input name="model" required placeholder="Contoh: IdeaPad"></div><div class="field"><label>Serial number (opsional)</label><input name="serialNumber" placeholder="Boleh dikosongkan"></div><div class="field full"><button class="btn">＋ Tambah perangkat</button></div></form></div><div class="section-head"><h2>Daftar perangkat</h2></div><div class="card">${ds.length?ds.map(d=>`<div class="device-row between"><div><b>💻 ${esc(d.merek)} ${esc(d.model)}</b><div class="smalltext">${esc(d.jenisPerangkat)} · SN: ${esc(d.serialNumber||'—')}</div></div><button class="btn danger small" onclick="deleteDevice('${d.id}')">Hapus</button></div>`).join(''):'<div class="empty">Belum ada perangkat terdaftar.</div>'}</div>`}
function orderRow(o,admin){const d=deviceBy(o.perangkatId),u=userBy(o.userId);return `<div class="order-row between"><div><div class="order-title">${esc(o.kodeServis)} ${badge(o.status)}</div><div class="smalltext">${admin?esc(u?.nama||'Pelanggan')+' · ':''}${esc(d?.merek||'Perangkat')} ${esc(d?.model||'')} · ${date(o.tanggalMasuk)}</div><div class="smalltext">${esc(serviceBy(o.layananId)?.namaLayanan||'Layanan')}</div></div><button class="btn secondary small" onclick="detailOrder('${o.id}')">Detail</button></div>`}
function orderList(mine,history){let list=mine.filter(o=>history?['Selesai','Dibatalkan'].includes(o.status):true).sort((a,b)=>b.tanggalMasuk.localeCompare(a.tanggalMasuk));if(!history&&isAdmin())list=mine.slice().sort((a,b)=>b.tanggalMasuk.localeCompare(a.tanggalMasuk));return `<div class="section-head"><h2>${history?'Riwayat servis':'Daftar pesanan'}</h2><span class="muted smalltext">${list.length} pesanan</span></div><div class="card">${list.length?list.map(o=>orderRow(o,isAdmin())).join(''):'<div class="empty">Tidak ada pesanan pada daftar ini.</div>'}</div>`}
function services(){return `<div class="section-head"><h2>Katalog layanan</h2></div><div class="card"><form id="serviceForm" class="form-grid"><div class="field"><label>Nama layanan</label><input name="namaLayanan" required></div><div class="field"><label>Harga indikatif (Rp)</label><input name="harga" type="number" min="0" required></div><div class="field full"><label>Deskripsi</label><textarea name="deskripsi" required></textarea></div><div class="field full"><button class="btn">＋ Tambah layanan</button></div></form></div><div class="cards" style="margin-top:15px">${db.services.map(s=>`<div class="card"><div class="between"><b>${esc(s.namaLayanan)}</b>${badge(s.status)}</div><p class="smalltext">${esc(s.deskripsi)}</p><div class="between"><b class="price">${money(s.harga)}</b><button class="btn secondary small" onclick="toggleService('${s.id}')">${s.status==='aktif'?'Nonaktifkan':'Aktifkan'}</button></div></div>`).join('')}</div>`}
function detailOrder(id){window.activeOrderId=id;const o=orderBy(id);if(!o||(!isAdmin()&&o.userId!==me().id))return toast('Pesanan tidak ditemukan atau akses ditolak.');const d=deviceBy(o.perangkatId),u=userBy(o.userId),p=db.payments.find(x=>x.pesananId===id),tracks=db.tracking.filter(t=>t.pesananId===id).sort((a,b)=>a.tanggalUpdate.localeCompare(b.tanggalUpdate));const admin=isAdmin();$('#modalRoot').innerHTML=`<div class="modal-back" onclick="if(event.target===this)closeModal()"><section class="modal"><div class="between"><h2>Detail ${esc(o.kodeServis)}</h2><button class="close" onclick="closeModal()">✕</button></div><div class="row">${badge(o.status)} ${badge('Persetujuan: '+o.persetujuanBiaya)}</div><p class="smalltext">Dibuat ${date(o.tanggalMasuk)} · ${admin?'Pelanggan: '+esc(u?.nama||'—'):''}</p><div class="card" style="box-shadow:none;margin:12px 0"><b>Perangkat</b><p style="margin:5px 0">${esc(d?.jenisPerangkat||'')} · ${esc(d?.merek||'')} ${esc(d?.model||'')}<br><span class="muted">SN: ${esc(d?.serialNumber||'—')}</span></p><b>Keluhan</b><p>${esc(o.keluhan)}</p>${o.foto?`<img class="photo" src="${o.foto}" alt="Foto perangkat">`:''}<p><b>Layanan:</b> ${esc(serviceBy(o.layananId)?.namaLayanan||'—')}</p><b>Diagnosis teknisi</b><p>${esc(o.diagnosa||'Belum ada diagnosis')}</p><b>Estimasi biaya final</b><p class="price">${o.estimasiBiaya===null?'Belum ditentukan':money(o.estimasiBiaya)}</p></div>${admin?adminOrderControls(o):customerOrderControls(o,p)}<div class="section-head"><h3>Tracking perbaikan</h3></div><div class="timeline">${tracks.length?tracks.map(t=>`<div class="event"><strong>${esc(t.status)}</strong><small>${date(t.tanggalUpdate)} · ${esc(userBy(t.adminId)?.nama||'Sistem')}</small><div>${esc(t.catatan)}</div></div>`).join(''):'Belum ada pembaruan.'}</div><div class="section-head"><h3>Pembayaran</h3></div>${p?`<div class="card" style="box-shadow:none"><div class="between"><b>${money(p.totalBayar)}</b>${badge(p.statusPembayaran)}</div><p class="smalltext">${esc(p.metodePembayaran)} · ${date(p.tanggalBayar)}</p><p class="smalltext">Referensi/bukti: ${esc(p.buktiBayar||'—')}</p></div>`:'<p class="muted">Belum ada pencatatan pembayaran.</p>'}</section></div>`}
function adminOrderControls(o){const p=db.payments.find(x=>x.pesananId===o.id);return `<div class="card" style="box-shadow:none"><h3>Panel admin / teknisi</h3><form id="diagnosisForm" class="form-grid"><div class="field full"><label>Diagnosis</label><textarea name="diagnosa" required>${esc(o.diagnosa||'')}</textarea></div><div class="field"><label>Estimasi final (Rp)</label><input name="estimasi" type="number" min="0" required value="${o.estimasiBiaya??''}"></div><div class="field" style="justify-content:end"><button class="btn">Simpan diagnosis & estimasi</button></div></form><hr style="border:0;border-top:1px solid var(--line);margin:16px 0"><form id="statusForm" class="form-grid"><div class="field"><label>Perbarui status</label><select name="status">${statuses.filter(s=>s!=='Dibatalkan'||o.status!=='Selesai').map(s=>`<option ${s===o.status?'selected':''}>${s}</option>`).join('')}</select></div><div class="field"><label>Catatan tracking</label><input name="catatan" placeholder="Contoh: penggantian SSD selesai" required></div><div class="field full"><button class="btn">Simpan status & tracking</button></div></form>${p?`<div class="actions"><button class="btn success" onclick="verifyPayment('${o.id}')">Konfirmasi pembayaran lunas</button><button class="btn danger" onclick="rejectPayment('${o.id}')">Tolak pembayaran</button></div>`:''}</div>`}
function customerOrderControls(o,p){let html='';if(o.estimasiBiaya!==null&&o.persetujuanBiaya==='menunggu')html+=`<div class="card" style="box-shadow:none"><b>Persetujuan biaya diperlukan</b><p>Diagnosis: ${esc(o.diagnosa)}<br>Estimasi: <b class="price">${money(o.estimasiBiaya)}</b></p><div class="actions"><button class="btn success" onclick="approve('${o.id}')">Setujui biaya</button><button class="btn danger" onclick="decline('${o.id}')">Tolak biaya</button></div></div>`;if(o.persetujuanBiaya==='disetujui'&&!p&&o.status!=='Selesai')html+=`<div class="card" style="box-shadow:none"><b>Catat pembayaran</b><p class="smalltext">Pencatatan ini tidak memproses uang secara online. Lakukan pembayaran melalui kanal resmi toko.</p><form id="paymentForm" class="form-grid"><div class="field"><label>Nominal</label><input name="totalBayar" type="number" min="0" value="${o.estimasiBiaya}" required></div><div class="field"><label>Metode</label><select name="metodePembayaran"><option>Tunai</option><option>Transfer Bank</option><option>QRIS</option></select></div><div class="field full"><label>Referensi pembayaran (opsional)</label><input name="buktiBayar" placeholder="Contoh: REF-DEMO-001; jangan masukkan data rekening"></div><div class="field full"><button class="btn">Catat pembayaran</button></div></form></div>`;return html}
function closeModal(){$('#modalRoot').innerHTML=''}
window.logout=()=>{db.session=null;save();render()};
window.go=go;window.closeModal=closeModal;
window.deleteDevice=id=>{if(db.orders.some(o=>o.perangkatId===id))return toast('Perangkat sudah digunakan pesanan dan tidak dapat dihapus.');if(confirm('Hapus perangkat ini?')){db.devices=db.devices.filter(d=>d.id!==id);save();render()}};
window.toggleService=id=>{const s=serviceBy(id);s.status=s.status==='aktif'?'nonaktif':'aktif';save();render()};
window.detailOrder=detailOrder;
window.approve=id=>{const o=orderBy(id);if(!o||isAdmin()||o.userId!==me().id||o.estimasiBiaya===null)return toast('Aksi tidak diizinkan.');o.persetujuanBiaya='disetujui';o.status='Menunggu Antrean Perbaikan';addTrack(o,o.status,'Pelanggan menyetujui estimasi biaya '+money(o.estimasiBiaya));save();detailOrder(id);toast('Biaya disetujui.')};
window.decline=id=>{const o=orderBy(id);if(!o||isAdmin()||o.userId!==me().id)return toast('Aksi tidak diizinkan.');o.persetujuanBiaya='ditolak';o.status='Menunggu Konfirmasi Pelanggan';addTrack(o,o.status,'Pelanggan menolak estimasi biaya. Perbaikan belum dilakukan.');save();detailOrder(id);toast('Penolakan biaya dicatat.')};
window.verifyPayment=id=>{if(!isAdmin())return;const p=db.payments.find(x=>x.pesananId===id);if(!p)return;p.statusPembayaran='Lunas';save();const o=orderBy(id);addTrack(o,o.status,'Pembayaran dikonfirmasi lunas oleh admin.');save();detailOrder(id);toast('Pembayaran dikonfirmasi.')};
window.rejectPayment=id=>{if(!isAdmin())return;const p=db.payments.find(x=>x.pesananId===id);if(!p)return;p.statusPembayaran='Ditolak';save();detailOrder(id);toast('Pembayaran ditolak.')};
document.addEventListener('submit',async e=>{
if(e.target.id==='deviceForm'){e.preventDefault();const f=new FormData(e.target),d={id:uid('dev'),userId:me().id,jenisPerangkat:f.get('jenisPerangkat'),merek:String(f.get('merek')).trim(),model:String(f.get('model')).trim(),serialNumber:String(f.get('serialNumber')).trim()};db.devices.push(d);save();render();toast('Perangkat berhasil ditambahkan.')}
if(e.target.id==='bookingForm'){e.preventDefault();const form=e.target,f=new FormData(form),device=db.devices.find(d=>d.id===f.get('perangkatId')&&d.userId===me().id),service=serviceBy(f.get('layananId'));if(!device||!service||service.status!=='aktif')return toast('Perangkat atau layanan tidak valid.');const keluhan=String(f.get('keluhan')).trim(),recent=db.orders.find(o=>o.userId===me().id&&o.perangkatId===device.id&&o.layananId===service.id&&o.keluhan.toLowerCase()===keluhan.toLowerCase()&&Date.now()-new Date(o.tanggalMasuk).getTime()<600000&&!['Selesai','Dibatalkan'].includes(o.status));if(recent)return toast('Pesanan serupa baru dibuat. Cegah duplikasi dalam 10 menit.');const file=f.get('foto');let photo=null;if(file&&file.size){if(!['image/jpeg','image/png'].includes(file.type)||file.size>2*1024*1024)return toast('Foto harus JPG/PNG dan maksimal 2 MB.');try{photo=await new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=reject;r.readAsDataURL(file)})}catch(err){return toast('Foto gagal dibaca.')}}const o={id:uid('ord'),userId:me().id,perangkatId:device.id,layananId:service.id,kodeServis:makeCode(),keluhan,foto:photo,diagnosa:'',estimasiBiaya:null,persetujuanBiaya:'menunggu',status:'Menunggu Pemeriksaan',tanggalMasuk:new Date().toISOString(),tanggalSelesai:null};db.orders.push(o);addTrack(o,o.status,'Pesanan berhasil diterima. Menunggu pemeriksaan teknisi.');save();state.tab='orders';render();toast('Pesanan dibuat: '+o.kodeServis)}
if(e.target.id==='diagnosisForm'){e.preventDefault();if(!isAdmin())return;const o=orderBy(currentModalId());const f=new FormData(e.target),amount=Number(f.get('estimasi'));if(!o||!String(f.get('diagnosa')).trim()||!Number.isFinite(amount)||amount<0)return toast('Diagnosis dan estimasi harus valid.');o.diagnosa=String(f.get('diagnosa')).trim();o.estimasiBiaya=amount;o.persetujuanBiaya='menunggu';if(o.status==='Menunggu Pemeriksaan'||o.status==='Sedang Diperiksa')o.status='Menunggu Persetujuan Biaya';addTrack(o,o.status,'Hasil pemeriksaan dan estimasi final: '+money(amount)+'. Menunggu keputusan pelanggan.');save();detailOrder(o.id);toast('Diagnosis dan estimasi disimpan.')}
if(e.target.id==='statusForm'){e.preventDefault();if(!isAdmin())return;const o=orderBy(currentModalId()),f=new FormData(e.target),status=f.get('status'),note=String(f.get('catatan')).trim();if(!o)return;if(['Menunggu Antrean Perbaikan','Sedang Diperbaiki','Menunggu Pengambilan','Selesai'].includes(status)&&o.persetujuanBiaya!=='disetujui')return toast('Tidak dapat memulai perbaikan sebelum pelanggan menyetujui biaya.');if(status==='Menunggu Persetujuan Biaya'&&o.estimasiBiaya===null)return toast('Isi diagnosis dan estimasi terlebih dahulu.');o.status=status;if(status==='Selesai')o.tanggalSelesai=new Date().toISOString();addTrack(o,status,note);save();detailOrder(o.id);toast('Status dan tracking diperbarui.')}
if(e.target.id==='paymentForm'){e.preventDefault();const id=currentModalId(),o=orderBy(id),f=new FormData(e.target),amount=Number(f.get('totalBayar'));if(!o||isAdmin()||o.userId!==me().id||o.persetujuanBiaya!=='disetujui')return toast('Aksi tidak diizinkan.');if(amount!==Number(o.estimasiBiaya))return toast('Nominal harus sama dengan estimasi yang disetujui.');if(db.payments.some(p=>p.pesananId===id))return toast('Pembayaran sudah dicatat.');const p={id:uid('pay'),pesananId:id,totalBayar:amount,metodePembayaran:f.get('metodePembayaran'),buktiBayar:String(f.get('buktiBayar')).trim(),statusPembayaran:'Menunggu Verifikasi',tanggalBayar:new Date().toISOString()};db.payments.push(p);save();addTrack(o,o.status,'Pelanggan mencatat pembayaran; menunggu verifikasi admin.');save();detailOrder(id);toast('Pembayaran tercatat, menunggu verifikasi admin.')}
if(e.target.id==='serviceForm'){e.preventDefault();if(!isAdmin())return;const f=new FormData(e.target),price=Number(f.get('harga'));db.services.push({id:uid('srv'),namaLayanan:String(f.get('namaLayanan')).trim(),deskripsi:String(f.get('deskripsi')).trim(),harga:price,status:'aktif'});save();render();toast('Layanan ditambahkan.')}
});
function currentModalId(){return $('#modalRoot .modal')?.dataset.orderId||window.activeOrderId}
const originalDetail=detailOrder;
detailOrder=(id)=>{window.activeOrderId=id;originalDetail(id);const modal=$('#modalRoot .modal');if(modal)modal.dataset.orderId=id};
document.addEventListener('change',e=>{if(e.target.name==='foto'){const file=e.target.files[0],img=$('#photoPreview');if(file&&img){if(file.size>2*1024*1024){e.target.value='';return toast('Ukuran foto maksimal 2 MB.')}const r=new FileReader();r.onload=()=>{img.src=r.result;img.classList.remove('hidden')};r.readAsDataURL(file)}}});
window.resetDemo=()=>{if(confirm('Hapus seluruh data lokal dan kembalikan demo awal?')){db=seed();save();render();toast('Data demo direset.')}};
render();
})();
</script>
</body></html>
